services:
  database:
    image: postgres:16-alpine
    container_name: afghan-connect-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: afghan_connect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: afghan_connect_local_db
    ports:
      - "6000:6000"
    volumes:
      - afghan_connect_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d afghan_connect"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: afghan-connect-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      CLIENT_URL: http://localhost:5173
      DB_HOST: database
      DB_PORT: 6000
      DB_NAME: afghan_connect
      DB_USER: postgres
      DB_PASSWORD: afghan_connect_local_db
      DB_SSL: "false"
      JWT_SECRET: local_development_only_change_before_deployment_2026_afghan_connect
      JWT_EXPIRES_IN: 1d
    ports:
      - "5000:5000"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: afghan-connect-web
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  afghan_connect_pgdata:
